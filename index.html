  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  

<script>
(function(){
  const STORAGE_KEYS={sheets:"sheets_config",companies:"company_leads",candidates:"candidate_leads"};
  const SMART_PULL_KEY="smart_pull_config_v2";
  function getCfg(){try{const c=JSON.parse(localStorage.getItem(SMART_PULL_KEY)||"{}");return{enabled:c.enabled!==false,limit:c.limit||100,offset:c.offset||0}}catch(e){return{enabled:true,limit:100,offset:0}}}
  function setCfg(c){localStorage.setItem(SMART_PULL_KEY,cfgStr(c)); localStorage.setItem("smart_pull_config",cfgStr(c));}
  function cfgStr(c){return JSON.stringify(c)}
  // hide auto pull
  function hideAutoPull(){
    document.querySelectorAll('button').forEach(b=>{
      const t=(b.innerText||"").trim().toLowerCase();
      if(t==="auto pull"||t.includes("auto pull")){
        const inLeads = b.closest('div') ? true : false;
        // hide if in Company/Candidate/Profile/NoResults context
        if(t.includes("auto pull")){ b.style.display="none"; b.setAttribute("data-hidden","auto-pull"); }
      }
      if(t==="pull from google sheet"){
        // Hide only outside Master Control DataTransfer? Check if parent has Master Control heading nearby
        const master = document.body.innerHTML.includes("Master Control Panel") && b.closest('div');
        // If button is inside Master Control Sheets tab, we will hide old and replace with Smart Pull
        // Keep logic: hide all Pull from Google Sheet buttons in Leads tabs
        const h1=document.querySelector('h1');
        const title=h1?h1.innerText.toLowerCase():"";
        if(title.includes("company")||title.includes("candidate")||title.includes("profile")||title.includes("deal")){
          b.style.display="none";
        }
      }
    });
    // hide tabs
    document.querySelectorAll('*').forEach(el=>{
      if(el.children.length===0 && el.innerText && el.innerText.trim().toLowerCase()==="auto pull"){
        el.style.display="none";
        if(el.parentElement && el.parentElement.classList.contains("flex")) el.style.display="none";
      }
    });
  }
  function toast(msg){
    let t=document.getElementById('__sp_toast');
    if(!t){t=document.createElement('div');t.id='__sp_toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#000;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-style:italic;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3)';document.body.appendChild(t);}
    t.innerText=msg;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',3000);
  }
  function injectControl(){
    if(document.getElementById('smart-pull-control-v2')) return;
    const hs=document.querySelectorAll('h3');
    let sec=null;
    hs.forEach(h=>{if(h.innerText.includes('Google Sheets Config')) sec=h.closest('div.bg-white')});
    if(!sec) return;
    const cfg=getCfg();
    const div=document.createElement('div');
    div.id='smart-pull-control-v2';
    div.className='bg-white border rounded-[16px] p-5 mt-4';
    div.style.borderColor='#e9e9e9';
    div.innerHTML=`
      <div class="flex items-center justify-between mb-3"><h3 class="font-bold italic text-[15px]">Smart Pull Control</h3><span class="text-[10px] italic bg-[#2f67ff] text-white px-2 py-1 rounded">SMART</span></div>
      <div class="flex flex-wrap gap-5 items-center">
        <div class="flex items-center gap-3"><label class="italic text-[13px] font-medium">Smart Pull</label>
          <button id="sp-toggle-v2" class="w-[48px] h-[28px] rounded-full relative transition-all" style="background:${cfg.enabled?'#2f67ff':'#e5e7eb'}"><div class="w-[22px] h-[22px] bg-white rounded-full shadow mt-[2px] ml-[2px] transition-all" style="transform:${cfg.enabled?'translateX(20px)':'translateX(0px)'}"></div></button>
          <span id="sp-status-v2" class="text-[12px] italic font-bold" style="color:${cfg.enabled?'#2f67ff':'#999'}">${cfg.enabled?'ON':'OFF'}</span>
        </div>
        <div class="flex items-center gap-2"><label class="italic text-[12px] font-medium">Limit:</label><select id="sp-limit-v2" class="h-[36px] px-3 rounded-[10px] border bg-white text-[12px] italic"><option value="50" ${cfg.limit==50?'selected':''}>50</option><option value="100" ${cfg.limit==100?'selected':''}>100</option><option value="200" ${cfg.limit==200?'selected':''}>200</option></select></div>
        <div class="text-[11px] italic text-gray-500">Empty tab = first 100 latest • 0 results = auto matching pull • Call/Mail buttons safe</div>
      </div>
      <div id="sp-info-v2" class="mt-3 text-[11px] italic text-gray-600"></div>
    `;
    sec.parentNode.insertBefore(div, sec.nextSibling);
    document.getElementById('sp-toggle-v2').onclick=function(){
      const c=getCfg();c.enabled=!c.enabled;c.offset=0;setCfg(c);
      this.style.background=c.enabled?'#2f67ff':'#e5e7eb';this.firstElementChild.style.transform=c.enabled?'translateX(20px)':'translateX(0px)';
      document.getElementById('sp-status-v2').innerText=c.enabled?'ON':'OFF';document.getElementById('sp-status-v2').style.color=c.enabled?'#2f67ff':'#999';
      toast('Smart Pull '+(c.enabled?'ON':'OFF'));
    };
    document.getElementById('sp-limit-v2').onchange=function(){const c=getCfg();c.limit=parseInt(this.value);c.offset=0;setCfg(c);toast('Limit '+c.limit);};
    // hide old Pull button inside this panel area
    document.querySelectorAll('button').forEach(b=>{if(b.innerText.trim()==='Pull from Google Sheet'){ const near = b.closest('div.bg-white'); if(near && near.innerText.includes('Import & Pull')){ b.style.display='none'; }}});
  }
  function extractId(url){if(!url) return null; let m=url.match(/\/d\/([a-zA-Z0-9-_]+)/); if(m) return m[1]; m=url.match(/[?&]id=([a-zA-Z0-9-_]+)/); if(m) return m[1]; if(url.length>20 && !url.includes('http')) return url; return url;}
  async function fetchSheet(key){
    try{
      const rawCfg=localStorage.getItem(STORAGE_KEYS.sheets); if(!rawCfg) return null;
      const cfg=JSON.parse(rawCfg); const webapp=cfg.webapp_url; if(!webapp) {toast('Web App URL dalo Master Control me'); return null;}
      const sheetUrl=cfg.sheets?cfg.sheets[key]:null; if(!sheetUrl){toast(key+' Sheet ID missing'); return null;}
      const sid=extractId(sheetUrl);
      const urls=[webapp+(webapp.includes('?')?'&':'?')+'sheetId='+encodeURIComponent(sid)+'&action=pull&type='+key, webapp+(webapp.includes('?')?'&':'?')+'sheetId='+encodeURIComponent(sid), webapp];
      for(let u of urls){
        try{
          const r=await fetch(u); const t=await r.text();
          try{ const j=JSON.parse(t); if(j) return j; }catch(e){ if(t.includes(',')){ /* csv fallback */ } }
        }catch(e){}
      }
      return null;
    }catch(e){ console.error(e); return null;}
  }
  function normalizeRows(raw, type){
    if(!raw) return [];
    let rows=[];
    if(Array.isArray(raw) && raw.length && Array.isArray(raw[0])){
      const headers=raw[0].map(h=> (h||'').toString().trim().toLowerCase());
      const data=raw.slice(1);
      rows=data.map(r=>{
        const o={}; headers.forEach((h,i)=>{o[h]=r[i];});
        return mapToApp(o,type);
      });
    } else if(Array.isArray(raw)){
      rows=raw.map(o=> mapToApp(o,type)).filter(Boolean);
    } else if(raw.data && Array.isArray(raw.data)){
      rows=raw.data.map(o=> mapToApp(o,type));
    } else if(raw.rows){
      rows=raw.rows.map(o=> mapToApp(o,type));
    }
    return rows.filter(r=>r && Object.keys(r).length>2);
  }
  function mapToApp(obj,type){
    // lower case keys
    const low={}; Object.keys(obj).forEach(k=>{ low[k.toLowerCase().trim()]=obj[k]; });
    const get=(...keys)=>{ for(let k of keys){ if(low[k.toLowerCase()]!==undefined && low[k.toLowerCase()]!=='' ) return low[k.toLowerCase()]; } return ''; };
    if(type==='company'){
      return {
        id: get('id','company_id','lead_id') || ('c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
        companyName: get('company_name','company','companyname','name')||'',
        contactPerson: get('contact_person','contact','person','contactperson')||'',
        phone: get('phone','mobile','contact_number','number')||'',
        email: get('email','mail')||'',
        location: get('location','city','address')||'',
        address: get('address','location')||'',
        requirement: get('requirement','profile','position','job','role')||'',
        createdAt: get('created_at','date','timestamp')|| new Date().toISOString(),
        source: 'smart_pull',
        ...obj
      };
    } else {
      return {
        id: get('id','candidate_id','lead_id') || ('cand_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
        name: get('name','candidate_name','candidate','full_name')||'',
        phone: get('phone','mobile','contact')||'',
        email: get('email')||'',
        location: get('location','city')||'',
        profile: get('profile','position','role','designation')||'',
        skills: get('skills','skill')||'',
        expType: get('exp_type','experience_type')||'Experienced',
        createdAt: get('created_at','date')|| new Date().toISOString(),
        source: 'smart_pull',
        ...obj
      };
    }
  }
  let busy=false;
  async function doPull(type, searchTerm){
    const cfg=getCfg(); if(!cfg.enabled) return; if(busy) return; busy=true;
    try{
      const info=document.getElementById('sp-info-v2'); if(info) info.innerText='Pulling '+type+'...';
      const raw=await fetchSheet(type);
      if(!raw){ if(info) info.innerText='Sheet se data nahi aaya - URL check karo'; busy=false; return; }
      let parsed=normalizeRows(raw,type).reverse(); // latest first
      if(parsed.length===0){ toast('Sheet empty'); busy=false; return; }
      let batch=[];
      if(searchTerm){
        const term=searchTerm.toLowerCase();
        batch=parsed.filter(o=> Object.values(o).some(v=> v && v.toString().toLowerCase().includes(term)) );
        if(batch.length===0){ toast('Sheet me bhi matching nahi mila'); if(info) info.innerText='No matching in sheet'; busy=false; return; }
        batch=batch.slice(0,cfg.limit);
      } else {
        const storageKey= type==='company'?STORAGE_KEYS.companies:STORAGE_KEYS.candidates;
        let existing=[]; try{ existing=JSON.parse(localStorage.getItem(storageKey)||'[]'); }catch(e){}
        if(existing.length>0){ busy=false; return; } // empty tab only
        batch=parsed.slice(0,cfg.limit);
        // set offset
        const newCfg=getCfg(); newCfg.offset=batch.length; setCfg(newCfg);
      }
      // merge
      const storageKey= type==='company'?STORAGE_KEYS.companies:STORAGE_KEYS.candidates;
      let existing=[]; try{ existing=JSON.parse(localStorage.getItem(storageKey)||'[]'); }catch(e){}
      const ids=new Set(existing.map(e=> (e.id||e.companyName||e.name||'').toString().toLowerCase()));
      let added=0;
      batch.forEach(item=>{
        const key=(item.id||item.companyName||item.name||'').toString().toLowerCase();
        if(!ids.has(key) && (item.companyName||item.name)){ existing.push(item); ids.add(key); added++; }
        else if(!item.id){ existing.push(item); added++; }
      });
      if(added>0 || searchTerm){
        if(searchTerm){ // for search, replace filtered view? we append to storage
          existing = [...existing, ...batch.filter(b=> !existing.some(e=> (e.id||'')===b.id))];
        }
        localStorage.setItem(storageKey, JSON.stringify(existing));
        toast(added+' records pulled');
        if(info) info.innerText=added+' pulled, total '+existing.length;
        setTimeout(()=>{ window.location.reload(); }, 700);
      }
    }catch(e){ console.error(e); toast('Pull failed'); }
    finally{ busy=false; }
  }
  function ensureLoadMore(){
    if(document.getElementById('sp-load-more-v2')) return;
    const h1=document.querySelector('h1'); if(!h1) return; const t=h1.innerText.toLowerCase();
    if(!(t.includes('company leads')||t.includes('candidate leads'))) return;
    const cfg=getCfg(); if(!cfg.enabled) return;
    const btn=document.createElement('button'); btn.id='sp-load-more-v2'; btn.className='mt-6 mx-auto block h-[40px] px-6 rounded-[12px] bg-black text-white italic text-[13px] font-bold';
    btn.innerText='Load More 100'; btn.onclick=async()=>{
      const type=t.includes('company')?'company':'candidate';
      const raw=await fetchSheet(type); let parsed=normalizeRows(raw,type).reverse();
      const cur=getCfg(); const offset=cur.offset||cur.limit;
      const next=parsed.slice(offset, offset+100);
      if(next.length===0){ toast('No more records'); btn.style.display='none'; return; }
      const sKey=type==='company'?STORAGE_KEYS.companies:STORAGE_KEYS.candidates;
      let ex=[]; try{ ex=JSON.parse(localStorage.getItem(sKey)||'[]'); }catch(e){}
      localStorage.setItem(sKey, JSON.stringify([...ex, ...next]));
      cur.offset=offset+next.length; setCfg(cur); toast(next.length+' more loaded'); setTimeout(()=>location.reload(),600);
    };
    const container=document.querySelector('main')||document.body; container.appendChild(btn);
  }
  // monitor 0 results
  let lastSearch='';
  function startObserver(){
    document.addEventListener('input', e=>{
      if(e.target.tagName==='INPUT' && e.target.placeholder && e.target.placeholder.toLowerCase().includes('search')) lastSearch=e.target.value.trim();
    });
    const obs=new MutationObserver(()=>{
      hideAutoPull(); injectControl(); ensureLoadMore();
      const bodyTxt=document.body.innerText;
      if(bodyTxt.includes('No Results')||bodyTxt.includes('No results')||bodyTxt.toLowerCase().includes('no matching')||bodyTxt.toLowerCase().includes('no leads found')){
        clearTimeout(window.__sp_z);
        window.__sp_z=setTimeout(()=>{
          const h1=document.querySelector('h1'); const title=h1?h1.innerText.toLowerCase():'';
          let type='company'; if(title.includes('candidate')||bodyTxt.toLowerCase().includes('candidate')) type='candidate';
          const term=lastSearch||'';
          if(getCfg().enabled) doPull(type, term||null);
        },900);
      }
      // empty tab detection
      const h1=document.querySelector('h1');
      if(h1){
        const tl=h1.innerText.toLowerCase();
        if(tl.includes('company leads')||tl.includes('candidate leads')){
          const sKey=tl.includes('company')?STORAGE_KEYS.companies:STORAGE_KEYS.candidates;
          let arr=[]; try{ arr=JSON.parse(localStorage.getItem(sKey)||'[]'); }catch(e){}
          if(arr.length===0){
            clearTimeout(window.__sp_e);
            window.__sp_e=setTimeout(()=>{ const tp=tl.includes('company')?'company':'candidate'; doPull(tp,null); },1300);
          }
        }
      }
    });
    obs.observe(document.body,{childList:true,subtree:true});
  }
  setTimeout(()=>{ hideAutoPull(); injectControl(); ensureLoadMore(); startObserver(); setInterval(()=>{ hideAutoPull(); injectControl(); ensureLoadMore(); },2000); },800);
})();
</script>
